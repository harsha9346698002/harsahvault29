<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Vault</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
}

header {
    padding: 20px;
    background: #11182d;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

.container {
    padding: 20px;
    max-width: 1000px;
    margin: auto;
}

.welcome {
    margin-bottom: 20px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}

.card {
    background: #151d35;
    border-radius: 15px;
    padding: 25px 15px;
    text-align: center;
    cursor: pointer;
    border: 1px solid #273354;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);
    background: #1b2645;
}

.icon {
    font-size: 38px;
    margin-bottom: 10px;
}

.card h3 {
    margin: 5px 0;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 18px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #1d4ed8;
}

.hidden {
    display: none;
}

.section {
    margin-top: 25px;
    background: #11182d;
    padding: 20px;
    border-radius: 15px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #39466b;
    background: #0b1020;
    color: white;
}

.item {
    background: #18213b;
    padding: 14px;
    margin: 8px 0;
    border-radius: 10px;
}

.back {
    margin-bottom: 15px;
}

/* LOGIN SCREEN */

#loginScreen {
    max-width: 400px;
    margin: 100px auto;
    padding: 30px;
    background: #11182d;
    border-radius: 20px;
    text-align: center;
    border: 1px solid #273354;
}

#loginScreen .lockIcon {
    font-size: 50px;
}

#loginScreen h1 {
    margin-bottom: 10px;
}

#loginScreen p {
    color: #9ca3af;
}

#loginScreen button {
    width: 100%;
    margin-top: 10px;
}

#loginStatus {
    min-height: 20px;
}

</style>

</head>

<body>

<!-- LOGIN SCREEN -->

<div id="loginScreen">


<div class="lockIcon">🔐</div>

<h1>Private Vault</h1>

<p>
    Secure access to your personal vault
</p>

<input
    type="email"
    id="email"
    placeholder="Email"
    autocomplete="email"
>

<input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
>

<button onclick="login()">
    🔓 Unlock Vault
</button>

<p id="loginStatus"></p>


</div>

<!-- VAULT SCREEN -->

<div id="vaultScreen" class="hidden">


<header>

    <h1>🔐 Private Vault</h1>

    <span>🟢 Secure Mode</span>

</header>

<div class="container">

    <div class="welcome">

        <h2>Welcome to your Vault</h2>

        <p>
            Your personal digital storage.
        </p>

    </div>

    <div class="grid">

        <div class="card">
            <div class="icon">📁</div>
            <h3>Folders</h3>
        </div>

        <div class="card">
            <div class="icon">📄</div>
            <h3>Files</h3>
        </div>

        <div class="card">
            <div class="icon">🖼️</div>
            <h3>Photos</h3>
        </div>

        <div class="card">
            <div class="icon">📑</div>
            <h3>PDFs</h3>
        </div>

        <div class="card">
            <div class="icon">👤</div>
            <h3>Contacts</h3>
        </div>

        <div class="card">
            <div class="icon">📝</div>
            <h3>Notes</h3>
        </div>

    </div>

</div>


</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://wuvywetmzceyvfudplht.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_MlzdMgwVN_bfGLEhu60Z-A_MxAhC4tb";


const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


async function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const status =
        document.getElementById("loginStatus");


    if (!email || !password) {

        status.textContent =
            "⚠️ Please enter your email and password.";

        return;
    }


    status.textContent =
        "🔄 Unlocking vault...";


    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        status.textContent =
            "❌ " + error.message;

        return;
    }


    status.textContent =
        "🔓 Vault unlocked!";


    document
        .getElementById("loginScreen")
        .classList.add("hidden");


    document
        .getElementById("vaultScreen")
        .classList.remove("hidden");


    console.log(
        "Logged in user:",
        data.user.id
    );

}

</script>

</body>
</html>
